<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Betting Insights & Strategy Blog | StakeTruth</title>
<meta name="description" content="Expert analysis, betting strategy, and football prediction insights from the StakeTruth team.">
<meta name="keywords" content="football betting tips, betting strategy blog, football prediction analysis">
<link rel="canonical" href="https://www.staketruth.com/blog.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StakeTruth">
<meta property="og:title" content="Football Betting Insights & Strategy Blog | StakeTruth">
<meta property="og:image" content="https://www.staketruth.com/images/logo.png">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section class="hero" style="padding-bottom:10px;">
    <div class="container">
      <h1>StakeTruth Blog</h1>
      <p>Betting strategy, prediction analysis, and football insights.</p>
      <div class="form-group" style="max-width:360px;margin:0 auto;">
        <input type="search" id="blog-search" class="form-control" placeholder="Search articles…">
      </div>
    </div>
  </section>

  <div class="ad-slot" data-placement="blog_infeed" style="max-width:1200px;margin:0 auto;"></div>

  <section>
    <div class="container">
      <div class="grid-3" id="blog-grid">
        <div class="skeleton" style="height:260px;border-radius:14px;"></div>
        <div class="skeleton" style="height:260px;border-radius:14px;"></div>
        <div class="skeleton" style="height:260px;border-radius:14px;"></div>
      </div>
      <div class="text-center" style="margin-top:20px;">
        <button class="btn btn-outline" id="load-more-btn">Load More</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
(function () {
  var page = 1;
  var searchTimer = null;

  function cardHtml(post) {
    return '<a href="/blog/' + post.slug + '" class="blog-card" style="display:block;">' +
      (post.featured_image ? '<img src="' + post.featured_image + '" alt="' + ST.escapeHtml(post.title) + '">' : '<div style="height:160px;background:var(--card-2);"></div>') +
      '<div class="blog-card__body">' +
        '<div class="blog-card__category">' + ST.escapeHtml(post.category || 'General') + '</div>' +
        '<h3 style="font-size:1.05rem;margin:6px 0;">' + ST.escapeHtml(post.title) + '</h3>' +
        '<p class="text-soft" style="font-size:0.85rem;">' + ST.escapeHtml(post.excerpt || '') + '</p>' +
        '<span class="text-soft" style="font-size:0.78rem;">' + ST.formatDate(post.published_at || post.created_at, { day: '2-digit', month: 'short', year: 'numeric' }) + '</span>' +
      '</div></a>';
  }

  async function load(append, search) {
    var grid = document.getElementById('blog-grid');
    if (!append) grid.innerHTML = '<div class="skeleton" style="height:260px;border-radius:14px;"></div>';
    try {
      var params = new URLSearchParams({ page: page, limit: 9 });
      var res = await ST.api('/blog?' + params.toString());
      var items = res.data;
      if (search) items = items.filter(function (p) { return p.title.toLowerCase().indexOf(search.toLowerCase()) !== -1; });
      var html = items.map(cardHtml).join('') || '<div class="empty-state">No articles yet — check back soon.</div>';
      if (append) grid.insertAdjacentHTML('beforeend', html); else grid.innerHTML = html;
      document.getElementById('load-more-btn').style.display = res.meta.hasNextPage ? '' : 'none';
    } catch (e) { grid.innerHTML = '<div class="empty-state">Could not load articles.</div>'; }
  }

  document.getElementById('load-more-btn').addEventListener('click', function () { page++; load(true); });
  document.getElementById('blog-search').addEventListener('input', function () {
    clearTimeout(searchTimer);
    var val = this.value;
    searchTimer = setTimeout(function () { page = 1; load(false, val); }, 300);
  });

  load(false);
})();
</script>
</body>
</html>
