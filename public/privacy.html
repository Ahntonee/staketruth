<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privacy Policy | StakeTruth</title>
<meta name="description" content="StakeTruth Privacy Policy.">
<link rel="canonical" href="https://www.staketruth.com/privacy.html">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main><section><div class="container" style="max-width:760px;">
  <div class="article-content" id="page-content"><div class="skeleton" style="height:300px;border-radius:14px;"></div></div>
</div></section></main>
<footer class="site-footer" id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
ST.api('/pages/privacy').then(function (res) {
  var raw = window.marked ? marked.parse(res.data.content || '') : res.data.content;
  document.title = res.data.title + ' | StakeTruth';
  document.getElementById('page-content').innerHTML = window.DOMPurify ? DOMPurify.sanitize(raw) : raw;
}).catch(function () { document.getElementById('page-content').innerHTML = '<p>Privacy policy content is being updated.</p>'; });
</script>
</body>
</html>
