<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Dashboard | StakeTruth</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section>
    <div class="container">
      <div id="guest-block" class="hidden empty-state">
        <p>Please log in to view your dashboard.</p>
        <button class="btn btn-primary" data-auth-open="login">Log In</button>
      </div>

      <div id="dashboard-content" class="hidden">
        <div class="grid-2" style="grid-template-columns: 1fr 1fr; margin-bottom:20px;">
          <div class="card card-pad" id="profile-card"></div>
          <div class="card card-pad" id="subscription-card"></div>
        </div>
        <div id="telegram-card"></div>

        <div class="tab-row" style="margin:20px 0 12px;">
          <button class="category-tab active" data-tab="bookmarks">Bookmarks</button>
          <button class="category-tab" data-tab="bets">Bet History</button>
          <button class="category-tab" data-tab="settings">Account Settings</button>
        </div>

        <div id="tab-bookmarks"><div class="skeleton" style="height:120px;border-radius:14px;"></div></div>
        <div id="tab-bets" class="hidden"></div>
        <div id="tab-settings" class="hidden"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
(function () {
  async function init() {
    var user = await ST.refreshAuth();
    if (!user) { document.getElementById('guest-block').classList.remove('hidden'); return; }
    document.getElementById('dashboard-content').classList.remove('hidden');

    document.getElementById('profile-card').innerHTML =
      '<h3 class="section-title" style="font-size:1rem;"><span class="material-icons-round">person</span>Profile</h3>' +
      '<p><strong>' + ST.escapeHtml(user.name) + '</strong></p>' +
      '<p class="text-soft">' + ST.escapeHtml(user.email) + '</p>' +
      '<span class="badge ' + (user.role === 'vip' ? 'badge-vip' : user.role === 'admin' ? 'badge-vip' : 'badge-pending') + '">' + user.role.toUpperCase() + '</span>' +
      (user.country ? '<p class="text-soft" style="margin-top:8px;">' + ST.escapeHtml(user.country) + '</p>' : '');

    try {
      var subRes = await ST.api('/subscriptions/status');
      var sub = subRes.data;
      var subCard = document.getElementById('subscription-card');
      if (sub && sub.status === 'active') {
        subCard.innerHTML = '<h3 class="section-title" style="font-size:1rem;"><span class="material-icons-round">workspace_premium</span>Subscription</h3>' +
          '<p>Plan: <strong>' + sub.plan + '</strong></p><p>Expires: ' + new Date(sub.expires_at).toDateString() + '</p>' +
          '<button class="btn btn-outline btn-sm" id="cancel-sub-btn">Cancel Subscription</button>';
        document.getElementById('cancel-sub-btn').addEventListener('click', async function () {
          if (!confirm('Cancel your VIP subscription? You will keep access until it expires.')) return;
          await ST.api('/subscriptions/cancel', { method: 'POST' });
          ST.showToast('Subscription cancelled.', 'info');
          init();
        });

        if (user.role === 'vip' && !user.telegram_invited) {
          document.getElementById('telegram-card').innerHTML =
            '<div class="card card-pad" style="margin-bottom:20px;background:var(--gradient-green);color:#241a0d;">' +
            '<strong>Join the VIP Telegram Channel</strong><p>Get real-time pick alerts.</p>' +
            '<button class="btn" style="background:#241a0d;color:#fff;" id="telegram-btn">Join Now</button></div>';
          document.getElementById('telegram-btn').addEventListener('click', async function () {
            await ST.api('/users/telegram-invited', { method: 'PUT' });
            window.open('https://t.me/', '_blank');
          });
        }
      } else {
        subCard.innerHTML = '<h3 class="section-title" style="font-size:1rem;"><span class="material-icons-round">workspace_premium</span>Subscription</h3>' +
          '<p class="text-soft">You are not subscribed to VIP.</p><a href="/pricing.html" class="btn btn-vip btn-sm">Upgrade to VIP</a>';
      }
    } catch (e) { /* silent */ }

    loadBookmarks();

    document.querySelectorAll('[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        ['bookmarks', 'bets', 'settings'].forEach(function (t) {
          document.getElementById('tab-' + t).classList.toggle('hidden', t !== btn.getAttribute('data-tab'));
        });
        if (btn.getAttribute('data-tab') === 'bets') loadBets();
        if (btn.getAttribute('data-tab') === 'settings') loadSettings();
      });
    });
  }

  async function loadBookmarks() {
    var el = document.getElementById('tab-bookmarks');
    try {
      var res = await ST.api('/users/bookmarks');
      el.innerHTML = res.data.length ? res.data.map(function (p) {
        return '<div class="card card-pad" style="margin-bottom:10px;"><a href="/prediction/' + p.slug + '"><strong>' + ST.escapeHtml(p.home_team) + ' vs ' + ST.escapeHtml(p.away_team) + '</strong></a><p class="text-soft">' + ST.escapeHtml(p.tip) + ' &middot; ' + ST.formatDate(p.match_date) + '</p></div>';
      }).join('') : '<div class="empty-state">No bookmarks yet.</div>';
    } catch (e) { el.innerHTML = '<div class="empty-state">Could not load bookmarks.</div>'; }
  }

  async function loadBets() {
    var el = document.getElementById('tab-bets');
    el.innerHTML = '<div class="skeleton" style="height:100px;border-radius:14px;"></div>';
    try {
      var res = await ST.api('/users/bet-history');
      var rows = res.data.map(function (b) {
        return '<tr><td data-label="Match">' + (b.home_team ? ST.escapeHtml(b.home_team) + ' vs ' + ST.escapeHtml(b.away_team) : '—') + '</td>' +
          '<td data-label="Stake">' + b.stake + '</td><td data-label="Odds">' + ST.formatOdds(b.odds) + '</td>' +
          '<td data-label="Result"><span class="badge badge-' + (b.result === 'won' ? 'won' : b.result === 'lost' ? 'lost' : 'pending') + '">' + b.result + '</span></td>' +
          '<td data-label="P&L">' + Number(b.profit_loss || 0).toFixed(2) + '</td></tr>';
      }).join('');
      el.innerHTML =
        '<div class="flex justify-between items-center" style="margin-bottom:10px;"><strong>Total P&amp;L: ' + Number(res.meta.totalPnl).toFixed(2) + '</strong><button class="btn btn-primary btn-sm" id="add-bet-btn">Add Bet</button></div>' +
        '<div class="table-scroll"><table class="data-table"><tr><th>Match</th><th>Stake</th><th>Odds</th><th>Result</th><th>P&amp;L</th></tr>' + (rows || '<tr><td colspan="5">No bets logged yet.</td></tr>') + '</table></div>';
      document.getElementById('add-bet-btn').addEventListener('click', openAddBetModal);
    } catch (e) { el.innerHTML = '<div class="empty-state">Could not load bet history.</div>'; }
  }

  function openAddBetModal() {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay open';
    overlay.innerHTML = '<div class="modal"><div class="modal-header"><h3>Add Bet</h3><button class="modal-close">&times;</button></div>' +
      '<form id="add-bet-form">' +
      '<div class="form-group"><label class="form-label">Stake</label><input required type="number" step="0.01" name="stake" class="form-control"></div>' +
      '<div class="form-group"><label class="form-label">Odds</label><input type="number" step="0.01" name="odds" class="form-control"></div>' +
      '<div class="form-group"><label class="form-label">Result</label><select name="result" class="form-control"><option value="void">Pending/Void</option><option value="won">Won</option><option value="lost">Lost</option></select></div>' +
      '<div class="form-group"><label class="form-label">Notes</label><textarea name="notes" class="form-control"></textarea></div>' +
      '<button class="btn btn-primary btn-block">Save Bet</button></form></div>';
    document.body.appendChild(overlay);
    overlay.querySelector('.modal-close').addEventListener('click', function () { overlay.remove(); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('#add-bet-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fd = new FormData(e.target);
      try {
        await ST.api('/users/bet-history', { method: 'POST', body: { stake: Number(fd.get('stake')), odds: Number(fd.get('odds')) || null, result: fd.get('result'), notes: fd.get('notes') } });
        overlay.remove();
        loadBets();
      } catch (err) { ST.showToast(err.message, 'error'); }
    });
  }

  function loadSettings() {
    var el = document.getElementById('tab-settings');
    el.innerHTML =
      '<div class="card card-pad" style="max-width:420px;margin-bottom:16px;">' +
      '<h3 class="section-title" style="font-size:1rem;">Change Password</h3>' +
      '<form id="password-form"><div class="form-group"><label class="form-label">Current Password</label><input required type="password" name="currentPassword" class="form-control"></div>' +
      '<div class="form-group"><label class="form-label">New Password</label><input required type="password" name="newPassword" class="form-control" minlength="8"></div>' +
      '<button class="btn btn-primary">Update Password</button></form></div>' +
      '<div class="card card-pad" style="max-width:420px;border-color:var(--danger);">' +
      '<h3 class="section-title" style="font-size:1rem;color:var(--danger);">Danger Zone</h3>' +
      '<p class="text-soft">Deleting your account is permanent.</p>' +
      '<button class="btn btn-danger" id="delete-account-btn">Delete My Account</button></div>';

    document.getElementById('password-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fd = new FormData(e.target);
      try {
        await ST.api('/auth/change-password', { method: 'POST', body: { currentPassword: fd.get('currentPassword'), newPassword: fd.get('newPassword') } });
        ST.showToast('Password updated.', 'success');
        e.target.reset();
      } catch (err) { ST.showToast(err.message, 'error'); }
    });
    document.getElementById('delete-account-btn').addEventListener('click', async function () {
      if (!confirm('This will permanently delete your account. Continue?')) return;
      try { await ST.api('/users/account', { method: 'DELETE' }); ST.clearUser(); window.location.href = '/'; }
      catch (err) { ST.showToast(err.message, 'error'); }
    });
  }

  init();
})();
</script>
</body>
</html>
