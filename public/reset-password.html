<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password | StakeTruth</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main>
  <section>
    <div class="container" style="max-width:420px;">
      <div class="card card-pad">
        <h1 style="font-size:1.3rem;">Set a New Password</h1>
        <div id="no-token-block" class="hidden empty-state">This reset link is invalid or missing a token.</div>
        <form id="reset-form">
          <div class="form-group"><label class="form-label">New Password</label><input required type="password" name="password" class="form-control" minlength="8"></div>
          <div class="form-group"><label class="form-label">Confirm Password</label><input required type="password" name="confirm" class="form-control" minlength="8"></div>
          <button class="btn btn-primary btn-block">Reset Password</button>
        </form>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
(function () {
  var token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('no-token-block').classList.remove('hidden');
    document.getElementById('reset-form').classList.add('hidden');
    return;
  }
  document.getElementById('reset-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    if (fd.get('password') !== fd.get('confirm')) { ST.showToast('Passwords do not match', 'error'); return; }
    try {
      await ST.api('/auth/reset-password', { method: 'POST', body: { token: token, password: fd.get('password') } });
      ST.showToast('Password reset — you can now log in.', 'success');
      setTimeout(function () { window.location.href = '/'; }, 1500);
    } catch (err) { ST.showToast(err.message, 'error'); }
  });
})();
</script>
</body>
</html>
