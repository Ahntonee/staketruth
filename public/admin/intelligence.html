<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prediction Intelligence | StakeTruth Admin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <div class="admin-overlay" id="admin-overlay"></div>
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <button class="admin-sidebar-toggle" id="sidebar-toggle"><span class="material-icons-round">menu</span></button>
      <h1 id="page-heading" style="font-size:1.1rem;margin:0;">Prediction Intelligence</h1>
      <div id="admin-user-slot"></div>
    </div>
    <div class="admin-content">
      <div class="flex justify-between items-center" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <select id="league-select" class="form-control" style="width:auto;min-width:220px;"><option value="">— Select League —</option></select>
        <button class="btn btn-primary btn-sm" id="load-btn"><span class="material-icons-round" style="font-size:1rem;">refresh</span> Load Data</button>
      </div>

      <div class="tab-row" id="page-tabs" style="margin-bottom:16px;">
        <button class="category-tab active" data-tab="overview"><span class="material-icons-round" style="font-size:1rem;vertical-align:middle;">bar_chart</span> League Overview</button>
        <button class="category-tab" data-tab="standings"><span class="material-icons-round" style="font-size:1rem;vertical-align:middle;">emoji_events</span> Standings</button>
        <button class="category-tab" data-tab="match-intel"><span class="material-icons-round" style="font-size:1rem;vertical-align:middle;">manage_search</span> Match Intel</button>
        <button class="category-tab" data-tab="accuracy"><span class="material-icons-round" style="font-size:1rem;vertical-align:middle;">track_changes</span> Accuracy Tracker</button>
      </div>

      <div id="tab-content">
        <div class="card card-pad text-center" style="padding:60px 20px;">
          <span class="material-icons-round" style="font-size:2.5rem;color:var(--text-soft);">hub</span>
          <p class="text-soft" style="margin-top:8px;">Select a league above and click Load Data.</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/admin.js"></script>
<script>
(function () {
  var state = { leagueId: '', tab: 'overview', loaded: false, data: {} };

  function accuracyDot(pct) {
    var color = pct >= 70 ? 'var(--success)' : pct >= 55 ? 'var(--light-green)' : pct >= 40 ? 'var(--warning)' : 'var(--danger)';
    return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:6px;"></span>';
  }

  function emptyState(msg) {
    return '<div class="card card-pad text-center" style="padding:40px 20px;"><span class="material-icons-round" style="font-size:2rem;color:var(--text-soft);">info</span><p class="text-soft" style="margin-top:8px;">' + msg + '</p></div>';
  }

  async function loadLeagueOptions() {
    var res = await AD.api('/leagues');
    var select = document.getElementById('league-select');
    res.data.forEach(function (l) {
      var opt = document.createElement('option');
      opt.value = l.id; opt.textContent = l.name + (l.country ? ' (' + l.country + ')' : '');
      select.appendChild(opt);
    });
  }

  function renderOverview() {
    var d = state.data.overview;
    if (!d) return emptyState('No overview data — try Load Data again.');
    var s = d.stats;
    var p = d.predictions;
    var tiles = [
      { label: 'Total Predictions', value: p.total_predictions || 0 },
      { label: 'Upcoming', value: p.upcoming || 0 },
      { label: 'Settled', value: p.settled || 0 },
      { label: 'Goals / Game', value: s ? Number(s.goals_per_game).toFixed(2) : '—' },
    ];
    var html = '<div class="kpi-grid" style="margin-bottom:18px;">' + tiles.map(function (t) {
      return '<div class="stat-card"><div class="stat-card__value" style="font-size:1.6rem;font-weight:800;">' + t.value + '</div><div class="stat-card__label">' + t.label + '</div></div>';
    }).join('') + '</div>';

    if (s) {
      var marketRows = [
        ['BTTS', s.btts_percentage], ['Over 1.5', s.over_1_5_percentage], ['Over 2.5', s.over_2_5_percentage],
        ['Over 3.5', s.over_3_5_percentage], ['Home Win', s.home_win_percentage], ['Away Win', s.away_win_percentage], ['Draw', s.draw_percentage],
      ];
      html += '<div class="card card-pad"><h3 class="section-title" style="font-size:1rem;">Market Tendencies (season ' + (s.season || '—') + ')</h3>' +
        '<div class="table-scroll"><table class="data-table"><thead><tr><th>Market</th><th>Frequency</th></tr></thead><tbody>' +
        marketRows.map(function (r) {
          var pct = r[1] != null ? Number(r[1]).toFixed(1) : null;
          return '<tr><td data-label="Market"><strong>' + r[0] + '</strong></td><td data-label="Frequency">' + (pct != null ? accuracyDot(pct) + pct + '%' : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    } else {
      html += emptyState('No league statistics computed yet for this league (runs nightly via the stats refresh job).');
    }
    return html;
  }

  function renderStandings() {
    var rows = state.data.standings;
    if (!rows) return emptyState('No standings data — try Load Data again.');
    if (!rows.length) {
      return emptyState('No standings synced yet for this league.') +
        '<div class="text-center" style="margin-top:10px;"><button class="btn btn-outline btn-sm" id="sync-standings-btn">Sync Standings from API-Football</button></div>';
    }
    return '<div class="card card-pad">' +
      '<div class="flex justify-between items-center" style="margin-bottom:10px;"><h3 class="section-title" style="font-size:1rem;margin-bottom:0;">Standings (season ' + rows[0].season + ')</h3>' +
      '<button class="btn btn-outline btn-sm" id="sync-standings-btn">Resync</button></div>' +
      '<div class="table-scroll"><table class="data-table"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td data-label="#"><strong>' + r.rank + '</strong></td>' +
          '<td data-label="Team">' + (r.team_logo ? '<img src="' + r.team_logo + '" style="width:18px;height:18px;vertical-align:middle;margin-right:6px;object-fit:contain;">' : '') + AD.escapeHtml(r.team_name) + '</td>' +
          '<td data-label="P">' + r.played + '</td><td data-label="W">' + r.won + '</td><td data-label="D">' + r.drawn + '</td><td data-label="L">' + r.lost + '</td>' +
          '<td data-label="GF">' + r.goals_for + '</td><td data-label="GA">' + r.goals_against + '</td><td data-label="GD">' + r.goal_diff + '</td>' +
          '<td data-label="Pts"><strong>' + r.points + '</strong></td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function renderMatchIntel() {
    var rows = state.data.matchIntel;
    if (!rows) return emptyState('No match data — try Load Data again.');
    if (!rows.length) return emptyState('No recent or upcoming matches found for this league.');
    return '<div class="card card-pad"><h3 class="section-title" style="font-size:1rem;">Match Intel (recent 3 days + upcoming)</h3>' +
      '<div class="table-scroll"><table class="data-table"><thead><tr><th>Match</th><th>Date</th><th>Tip</th><th>Confidence</th><th>Status</th></tr></thead><tbody>' +
      rows.map(function (p) {
        return '<tr><td data-label="Match">' + AD.escapeHtml(p.home_team) + ' vs ' + AD.escapeHtml(p.away_team) + '</td>' +
          '<td data-label="Date">' + AD.formatDate(p.match_date) + '</td>' +
          '<td data-label="Tip">' + AD.escapeHtml(p.tip) + '</td>' +
          '<td data-label="Confidence">' + (p.intelligence_score != null ? p.intelligence_score : '—') + '</td>' +
          '<td data-label="Status">' + (p.result !== 'pending' ? '<span class="badge ' + (p.result === 'won' ? 'badge-won' : 'badge-lost') + '">' + p.result.toUpperCase() + '</span>' : (p.is_published ? '<span class="badge badge-won">Live</span>' : '<span class="badge badge-pending">Draft</span>')) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function renderAccuracy() {
    var rows = state.data.accuracy;
    if (!rows) return emptyState('No accuracy data — try Load Data again.');
    if (!rows.length) return emptyState('No graded predictions yet for this league.');
    return '<div class="card card-pad"><h3 class="section-title" style="font-size:1rem;">Accuracy Tracker</h3>' +
      '<div class="table-scroll"><table class="data-table"><thead><tr><th>Category</th><th>Tips</th><th>Won</th><th>Lost</th><th>Accuracy</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td data-label="Category"><strong>' + AD.escapeHtml(String(r.group_label)) + '</strong></td>' +
          '<td data-label="Tips">' + r.total + '</td>' +
          '<td data-label="Won" style="color:var(--success-dim);font-weight:700;">' + r.wins + '</td>' +
          '<td data-label="Lost" style="color:var(--danger);">' + r.losses + '</td>' +
          '<td data-label="Accuracy">' + accuracyDot(r.win_rate) + '<strong>' + r.win_rate + '%</strong></td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function renderTab() {
    var el = document.getElementById('tab-content');
    if (!state.loaded) { el.innerHTML = emptyState('Select a league above and click Load Data.'); return; }
    if (state.tab === 'overview') el.innerHTML = renderOverview();
    else if (state.tab === 'standings') el.innerHTML = renderStandings();
    else if (state.tab === 'match-intel') el.innerHTML = renderMatchIntel();
    else el.innerHTML = renderAccuracy();

    var syncBtn = document.getElementById('sync-standings-btn');
    if (syncBtn) syncBtn.addEventListener('click', async function () {
      syncBtn.disabled = true; syncBtn.textContent = 'Syncing…';
      try {
        var res = await AD.api('/admin/intelligence/league/' + state.leagueId + '/standings/sync', { method: 'POST' });
        if (res.data.skipped) { AD.showToast('Sync skipped: ' + (res.data.reason || 'unknown reason'), 'error'); }
        else AD.showToast('Synced ' + res.data.teams + ' teams', 'success');
        var standingsRes = await AD.api('/admin/intelligence/league/' + state.leagueId + '/standings');
        state.data.standings = standingsRes.data;
        renderTab();
      } catch (err) { AD.showToast(err.message, 'error'); syncBtn.disabled = false; syncBtn.textContent = 'Sync Standings from API-Football'; }
    });
  }

  document.getElementById('page-tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.category-tab');
    if (!btn) return;
    document.querySelectorAll('#page-tabs .category-tab').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.tab = btn.getAttribute('data-tab');
    renderTab();
  });

  document.getElementById('load-btn').addEventListener('click', async function (e) {
    var leagueId = document.getElementById('league-select').value;
    if (!leagueId) { AD.showToast('Pick a league first', 'error'); return; }
    state.leagueId = leagueId;
    e.target.disabled = true;
    document.getElementById('tab-content').innerHTML = emptyState('Loading…');
    try {
      var base = '/admin/intelligence/league/' + leagueId;
      var results = await Promise.all([
        AD.api(base + '/overview'), AD.api(base + '/standings'), AD.api(base + '/match-intel'), AD.api(base + '/accuracy'),
      ]);
      state.data = { overview: results[0].data, standings: results[1].data, matchIntel: results[2].data, accuracy: results[3].data };
      state.loaded = true;
      renderTab();
    } catch (err) { AD.showToast(err.message, 'error'); document.getElementById('tab-content').innerHTML = emptyState('Failed to load — try again.'); }
    e.target.disabled = false;
  });

  async function init() {
    var user = await AD.requireAdmin();
    if (!user) return;
    AD.renderShell('intelligence', user, 'Prediction Intelligence');
    loadLeagueOptions();
  }
  init();
})();
</script>
</body>
</html>
