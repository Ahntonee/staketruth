<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StakeTruth</title>
<meta name="description" content="Free and VIP football predictions from StakeTruth.">
<link rel="canonical" id="canonical-link" href="https://www.staketruth.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StakeTruth">
<meta property="og:image" content="https://www.staketruth.com/images/logo.png">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section style="padding-bottom:0;">
    <div class="container" style="max-width:900px;">
      <nav style="font-size:0.8rem;color:var(--text-soft);margin-bottom:12px;">
        <a href="/">Home</a> &rsaquo; <span id="breadcrumb-current">Predictions</span>
      </nav>
      <div id="page-container"><div class="skeleton" style="height:200px;border-radius:14px;"></div></div>
    </div>
  </section>

  <section>
    <div class="container" style="max-width:900px;">
      <h2 class="section-title" style="font-size:1.1rem;">Live Predictions</h2>
      <div id="predictions-list"><div class="skeleton" style="height:300px;border-radius:14px;"></div></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
(function () {
  var slugMatch = window.location.pathname.match(/\/topic\/([^/?#]+)/);
  var slug = slugMatch ? slugMatch[1] : null;

  async function load() {
    var pageContainer = document.getElementById('page-container');
    var listContainer = document.getElementById('predictions-list');
    if (!slug) { pageContainer.innerHTML = '<div class="empty-state">Page not found.</div>'; listContainer.innerHTML = ''; return; }
    try {
      var res = await ST.api('/seo-pages/' + slug);
      var page = res.data.page;
      var predictions = res.data.predictions;

      document.title = page.title;
      document.querySelector('meta[name="description"]').setAttribute('content', page.meta_description || '');
      document.getElementById('canonical-link').setAttribute('href', window.location.href);
      document.getElementById('breadcrumb-current').textContent = page.h1 || page.title;

      var rawHtml = window.marked ? marked.parse(page.intro_content || '') : (page.intro_content || '');
      var safeHtml = window.DOMPurify ? DOMPurify.sanitize(rawHtml) : rawHtml;
      pageContainer.innerHTML =
        '<h1>' + ST.escapeHtml(page.h1 || page.title) + '</h1>' +
        '<div class="article-content">' + safeHtml + '</div>';

      listContainer.innerHTML = predictions.length
        ? predictions.map(function (p) { return ST.buildPredictionCard(p); }).join('')
        : '<div class="empty-state">No live predictions for this yet — check back soon.</div>';
    } catch (e) {
      pageContainer.innerHTML = '<div class="empty-state">This page could not be found.</div>';
      listContainer.innerHTML = '';
    }
  }

  load();
})();
</script>
</body>
</html>
