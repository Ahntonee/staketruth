<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="page-title">StakeTruth</title>
<meta id="meta-description" name="description" content="Free and VIP football predictions from StakeTruth.">
<meta id="meta-keywords" name="keywords" content="">
<link rel="canonical" id="canonical-link" href="https://www.staketruth.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StakeTruth">
<meta id="og-title" property="og:title" content="StakeTruth">
<meta id="og-description" property="og:description" content="Free and VIP football predictions from StakeTruth.">
<meta id="og-image" property="og:image" content="https://www.staketruth.com/images/logo.png">
<meta id="og-url" property="og:url" content="https://www.staketruth.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://media.api-sports.io">

<link rel="preload" href="/fonts/7068a362fe.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/7e4b16eb8a.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/6cc5d6e405.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/material-icons-round.woff2" as="font" type="font/woff2" crossorigin>
<link href="/css/fonts.css" rel="stylesheet">

<link href="/css/reboot.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link href="/css/theme-clay.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section style="padding-bottom:0;">
    <div class="container" style="max-width:900px;">
      <nav style="font-size:0.8rem;color:var(--text-soft);margin-bottom:12px;">
        <a href="/">Home</a> &rsaquo; <span id="breadcrumb-current">Predictions</span>
      </nav>
      <div id="page-container"><div class="skeleton" style="height:200px;border-radius:14px;"></div></div>
    </div>
  </section>

  <section>
    <div class="container" style="max-width:900px;">
      <h2 class="section-title" style="font-size:1.1rem;">Live Predictions</h2>
      <div id="predictions-grid"><div class="skeleton" style="height:200px;border-radius:14px;"></div></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
<script src="/js/announcement-format.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/content-protection.js" defer></script>
<script>/* data-deferred: waits for deferred scripts (app.js etc.) */document.addEventListener('DOMContentLoaded', function () {
(function () {
  var slugMatch = window.location.pathname.match(/\/tips\/([^/?#]+)/);
  var slug = slugMatch ? slugMatch[1] : null;

  async function load() {
    var pageContainer = document.getElementById('page-container');
    var listContainer = document.getElementById('predictions-grid');
    if (!slug) { pageContainer.innerHTML = '<div class="empty-state">Page not found.</div>'; listContainer.innerHTML = ''; return; }
    try {
      var res = await ST.api('/seo-pages/' + slug);
      var page = res.data.page;
      var predictions = res.data.predictions;

      document.title = page.title;
      document.querySelector('meta[name="description"]').setAttribute('content', page.meta_description || '');
      document.getElementById('og-title').setAttribute('content', page.title);
      document.getElementById('og-description').setAttribute('content', page.meta_description || '');
      document.getElementById('og-url').setAttribute('content', window.location.origin + window.location.pathname);
      document.getElementById('canonical-link').setAttribute('href', window.location.origin + window.location.pathname);
      document.getElementById('breadcrumb-current').textContent = page.h1 || page.title;

      var rawHtml = window.marked ? marked.parse(page.intro_content || '') : (page.intro_content || '');
      var safeHtml = window.DOMPurify ? DOMPurify.sanitize(rawHtml) : rawHtml;
      pageContainer.innerHTML =
        '<h1>' + ST.escapeHtml(page.h1 || page.title) + '</h1>' +
        '<div class="article-content">' + safeHtml + '</div>';

      listContainer.innerHTML = predictions.length
        ? predictions.map(function (p) { return ST.buildPredictionCard(p); }).join('')
        : '<div class="empty-state">No live predictions for this yet — check back soon.</div>';
    } catch (e) {
      // The server has already rendered the article. A blocked or temporary
      // API failure must not replace valid content with a false 404 message.
      if (!pageContainer.querySelector('h1')) {
        pageContainer.innerHTML = '<div class="empty-state">This page is temporarily unavailable.</div>';
      }
      listContainer.innerHTML = '';
    }
  }

  load();
})();
});</script>
</body>
</html>
