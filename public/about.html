<script>/* data-deferred: waits for deferred scripts (app.js etc.) */document.addEventListener('DOMContentLoaded', function () {
(function () {
  ST.api('/pages/about').then(function (res) {
    var raw = window.marked ? marked.parse(res.data.content || '') : res.data.content;
    document.getElementById('about-content').innerHTML = window.DOMPurify ? DOMPurify.sanitize(raw) : raw;
    var duplicateHeading = document.querySelector('#about-content > h1:first-child');
    if (duplicateHeading) duplicateHeading.remove();
  }).catch(function () {
    document.getElementById('about-content').innerHTML = '<p>StakeTruth combines a real-time football data pipeline with a statistical Intelligence Engine.</p>';
  });
})();
});</script>
