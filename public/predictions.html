<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Football Predictions & Betting Tips | StakeTruth</title>
<meta name="description" content="Browse today's free and VIP football predictions by league, market, and confidence score. Updated daily from our Intelligence Engine.">
<meta name="keywords" content="football predictions today, best football tips today, VIP predictions, over/under 2.5 tips, BTTS tips today">
<link rel="canonical" href="https://www.staketruth.com/predictions.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StakeTruth">
<meta property="og:title" content="Today's Football Predictions & Betting Tips | StakeTruth">
<meta property="og:description" content="Free and VIP football predictions today, filterable by league, market, and date.">
<meta property="og:image" content="https://www.staketruth.com/images/logo.png">
<meta property="og:url" content="https://www.staketruth.com/predictions.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section style="padding-top:20px;padding-bottom:0;">
    <div class="container">
      <h1 style="font-size:1.5rem;">Today's Football Predictions</h1>
    </div>
  </section>

  <div class="ad-slot" data-placement="predictions_infeed"></div>

  <section style="padding-top:12px;">
    <div class="container">
      <div class="main-with-aside">
        <div class="main-with-aside__content">

          <div class="tab-row" id="category-tabs">
            <button class="category-tab active" data-category="all">All</button>
            <button class="category-tab" data-category="free">Free</button>
            <button class="category-tab" data-category="over_1_5">Over 1.5</button>
            <button class="category-tab" data-category="over_2_5">Over 2.5</button>
            <button class="category-tab" data-category="over_3_5">Over 3.5</button>
            <button class="category-tab" data-category="under_1_5">Under 1.5</button>
            <button class="category-tab" data-category="under_2_5">Under 2.5</button>
            <button class="category-tab" data-category="under_3_5">Under 3.5</button>
            <button class="category-tab" data-category="gg">BTTS</button>
            <button class="category-tab" data-category="home_win">Home Win</button>
            <button class="category-tab" data-category="away_win">Away Win</button>
            <button class="category-tab" data-category="draw">Draw</button>
            <button class="category-tab" data-category="vip">VIP</button>
          </div>
          <div class="tab-row" id="date-tabs" style="margin-top:8px;">
            <button class="category-tab" data-date="yesterday">Yesterday</button>
            <button class="category-tab active" data-date="today">Today</button>
            <button class="category-tab" data-date="tomorrow">Tomorrow</button>
          </div>

          <div class="grid-2" style="margin-top:12px;grid-template-columns:1fr 1fr;">
            <select id="league-filter" class="form-control"><option value="">All Leagues</option></select>
            <select id="market-filter" class="form-control">
              <option value="">All Markets</option>
              <option value="1X2">1X2</option>
              <option value="Over/Under">Over/Under</option>
              <option value="BTTS">BTTS</option>
              <option value="Draw No Bet">Draw No Bet</option>
              <option value="Correct Score">Correct Score</option>
            </select>
          </div>
          <div class="form-group" style="margin-top:10px;">
            <input type="search" id="search-input" class="form-control" placeholder="Search by team name…">
          </div>

          <div style="margin-top:20px;">
            <h2 class="section-title"><span class="material-icons-round">local_fire_department</span>Banker of the Day</h2>
            <div id="banker-cards"><div class="skeleton" style="height:160px;border-radius:14px;"></div></div>
          </div>

          <div style="margin-top:20px;" id="vip-teaser-section"></div>

          <div style="margin-top:20px;">
            <h2 class="section-title"><span class="material-icons-round">sports_soccer</span>All Predictions</h2>
            <div id="predictions-grid">
              <div class="skeleton" style="height:200px;border-radius:14px;margin-bottom:14px;"></div>
              <div class="skeleton" style="height:200px;border-radius:14px;margin-bottom:14px;"></div>
            </div>
            <div class="text-center" style="margin-top:12px;">
              <button class="btn btn-outline" id="load-more-btn">Load More</button>
            </div>
          </div>
        </div>

        <aside class="main-with-aside__aside">
          <div>
            <h3 style="font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:6px;"><span class="material-icons-round" style="color:var(--accent);">workspace_premium</span>VIP Picks of the Day</h3>
            <div class="aside-scroll-row" id="vip-picks-of-day"></div>
          </div>
          <div id="recent-wins-widget"></div>
        </aside>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/content-protection.js"></script>
<script>
(function () {
  var state = { category: 'all', date: 'today', league_id: '', market: '', search: '', page: 1 };
  var searchTimer = null;

  async function loadLeagues() {
    try {
      var grouped = await ST.fetchLeagues();
      var select = document.getElementById('league-filter');
      Object.keys(grouped).forEach(function (continent) {
        var group = document.createElement('optgroup');
        group.label = continent;
        grouped[continent].forEach(function (l) {
          var opt = document.createElement('option');
          opt.value = l.id; opt.textContent = l.name;
          group.appendChild(opt);
        });
        select.appendChild(group);
      });
    } catch (e) { /* optional */ }
  }

  async function loadPredictions(append) {
    var grid = document.getElementById('predictions-grid');
    if (!append) grid.innerHTML = '<div class="skeleton" style="height:200px;border-radius:14px;"></div>';
    var params = new URLSearchParams({ date: state.date, category: state.category, page: state.page, limit: 10 });
    if (state.league_id) params.set('league_id', state.league_id);
    if (state.market) params.set('market', state.market);
    if (state.search) params.set('search', state.search);
    try {
      var res = await ST.api('/predictions?' + params.toString());
      var html = res.data.map(ST.buildPredictionCard).join('') || '<div class="empty-state">No predictions found for this filter.</div>';
      if (append) grid.insertAdjacentHTML('beforeend', html);
      else grid.innerHTML = html;
      grid.querySelectorAll('[data-vote-poll]').forEach(function (el) {
        if (!el.dataset.wired) { el.dataset.wired = '1'; ST.initVotePoll(el, el.getAttribute('data-prediction-id')); }
      });
      document.getElementById('load-more-btn').style.display = res.meta.hasNextPage ? '' : 'none';
    } catch (e) { grid.innerHTML = '<div class="empty-state">Could not load predictions right now.</div>'; }
  }

  document.getElementById('category-tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.category-tab');
    if (!btn) return;
    document.querySelectorAll('#category-tabs .category-tab').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.category = btn.getAttribute('data-category'); state.page = 1; loadPredictions(false);
  });
  document.getElementById('date-tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.category-tab');
    if (!btn) return;
    document.querySelectorAll('#date-tabs .category-tab').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.date = btn.getAttribute('data-date'); state.page = 1; loadPredictions(false);
  });
  document.getElementById('league-filter').addEventListener('change', function () { state.league_id = this.value; state.page = 1; loadPredictions(false); });
  document.getElementById('market-filter').addEventListener('change', function () { state.market = this.value; state.page = 1; loadPredictions(false); });
  document.getElementById('search-input').addEventListener('input', function () {
    clearTimeout(searchTimer);
    var val = this.value;
    searchTimer = setTimeout(function () { state.search = val; state.page = 1; loadPredictions(false); }, 400);
  });
  document.getElementById('load-more-btn').addEventListener('click', function () { state.page++; loadPredictions(true); });

  function renderVipTeaser() {
    var user = ST.getUser();
    var isVip = user && (user.role === 'vip' || user.role === 'admin');
    if (isVip) { document.getElementById('vip-teaser-section').innerHTML = ''; return; }
    document.getElementById('vip-teaser-section').innerHTML =
      '<h2 class="section-title"><span class="material-icons-round">workspace_premium</span>VIP Picks</h2>' +
      '<div class="card card-pad text-center"><p>Unlock our highest-confidence VIP tips, the full VIP Picks of the Day rail, and Banker of the Day exclusives.</p>' +
      '<a href="/pricing.html" class="btn btn-vip">Join VIP</a></div>';
  }

  loadLeagues();
  loadPredictions(false);
  ST.renderBankerCards(document.getElementById('banker-cards'));
  ST.renderVipPicksOfDay(document.getElementById('vip-picks-of-day'));
  ST.renderRecentWins(document.getElementById('recent-wins-widget'));
  setTimeout(renderVipTeaser, 300);
})();
</script>
</body>
</html>
